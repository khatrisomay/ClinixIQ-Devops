name: Chaos Engineering & Resilience Verification

on:
  schedule:
    # Run weekly automated chaos validation on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  push:
    branches:
      - main
    paths:
      - 'chaos/**'
      - '.github/workflows/chaos.yml'
  workflow_dispatch:
    inputs:
      experiment:
        description: "Chaos experiment to execute (all, redis, latency, spike)"
        required: false
        default: "all"

jobs:
  resilience-validation:
    name: Execute Chaos Scenarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Launch ClinixIQ Application Server
        run: |
          echo "Launching ClinixIQ backend on port 8000..."
          python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000 &
          
          echo "Waiting for health check probe..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Server ready for chaos scenarios."
              break
            fi
            sleep 1
          done

      - name: Execute Chaos Experiments & Benchmark MTTR
        run: |
          mkdir -p reports/chaos
          python chaos/run_chaos.py --experiment ${{ github.event.inputs.experiment || 'all' }} --duration 3.0 --report reports/chaos/resilience_audit.json

      - name: Upload Chaos Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-audit-reports
          path: reports/chaos/
