name: End-to-End Automated Smoke Testing

on:
  push:
    branches:
      - main
    paths:
      - 'tests/smoke/**'
      - 'backend/**'
      - '.github/workflows/smoke-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tests/smoke/**'
      - 'backend/**'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to run smoke tests against (default: local stack)"
        required: false
        default: "http://localhost:8000"

jobs:
  e2e-smoke-tests:
    name: Production Smoke Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Launch ClinixIQ Application Server
        run: |
          echo "Starting ClinixIQ backend daemon on port 8000..."
          python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000 &
          
          echo "Waiting for backend readiness probe..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Backend is healthy and listening on port 8000."
              break
            fi
            sleep 1
          done

      - name: Execute Core API Smoke Probes
        run: |
          mkdir -p reports/smoke
          python tests/smoke/smoke_runner.py --url http://localhost:8000 --report reports/smoke/core_smoke.json

      - name: Execute Synthetic Patient Journey
        run: |
          python tests/smoke/test_patient_journey.py --url http://localhost:8000

      - name: Execute Synthetic Billing Journey
        run: |
          python tests/smoke/test_billing_journey.py --url http://localhost:8000

      - name: Upload Smoke Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: reports/smoke/
