title = "ClinixIQ Secret Detection Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for mock tokens, sample credentials, and documentation"
regexes = [
  '''clinixiq-.*''',
  '''admin12345''',
  '''whsec_.*''',
  '''whsec_clinixiq_production_mock_token''',
  '''clinixiq-secure-redis-pass-token''',
  '''clinixiq-jwt-session-encryption-key'''
]
paths = [
  '''k8s/base/secrets\.yaml$''',
  '''\.env\.example$''',
  '''jenkins/.*''',
  '''docs/.*'''
]
