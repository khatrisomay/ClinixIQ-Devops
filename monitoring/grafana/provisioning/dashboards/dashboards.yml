apiVersion: 1

providers:
  - name: 'ClinixIQ Dashboards'
    orgId: 1
    folder: 'ClinixIQ Telemetry'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
