apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinixiq-ingress
  namespace: clinixiq
  labels:
    app.kubernetes.io/name: clinixiq
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
spec:
  tls:
    - hosts:
        - clinixiq.example.com
      secretName: clinixiq-tls-secret
  rules:
    - host: clinixiq.example.com
      http:
        paths:
          # Route API requests to FastAPI Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: clinixiq-backend-service
                port:
                  number: 8000
          # Route all UI requests to React Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clinixiq-frontend-service
                port:
                  number: 8080
