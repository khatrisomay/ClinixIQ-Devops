apiVersion: v1
kind: ConfigMap
metadata:
  name: clinixiq-backend-config
  namespace: clinixiq
  labels:
    app.kubernetes.io/name: clinixiq
    app.kubernetes.io/component: backend
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  REDIS_URL: "redis://clinixiq-redis-service:6379/0"
  MODEL_NAME: "ClinixIQ-XGBoost-Med-v2.4"
  CACHE_TTL_SECONDS: "3600"
  RATE_LIMIT_PER_MINUTE: "120"
